[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-library"
version = "0.1.0"
description = "Sourced optical material models for infrared simulations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
materials_library = ["materials/*.yaml", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
