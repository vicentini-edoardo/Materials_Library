notes: ['Anharmonic oscillator: rho_l = (A^2 - i Gamma w)/(w_TO^2 - w^2 - i gamma w) (Mock 2017 Eq. 4); alpha measured from a. Published frame: x = a, -z = b, y =
    c* (sign of z irrelevant for rank-1 terms).', 'Published Table II lists alpha_TO = 24.3, 113.1, 0.8, 65.6, 81.9, 127.6, 145.1, 18.9 deg; the arXiv values used
    here differ by 180 deg for modes 2, 3, 5, 6, which is the same dipole direction.', 'Check: model eps_DC zz 11.57 (paper 11.56), xy 1.048 (1.05); xx/yy 15.66/16.51
    vs 16.16/16.01. The paper states eps_DC was extrapolated from the wavelength-by-wavelength data, not computed from the model; det(eps_DC) agrees to 0.1%, which
    is what the S-LST relation tests.', 'Default is the harmonic (passive) model: the paper''s anharmonic broadenings are stored as `anharmonic_paper` and ignored
