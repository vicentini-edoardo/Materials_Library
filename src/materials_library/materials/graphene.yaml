# graphene — generated by tools/build_library.py; edit there, not here.
name: graphene
status: verified
tensor: sheet
valid_range_cm1: [10, 20000]
model:
  type: graphene_falkovsky
  defaults: {mu_eV: 0.3, T_K: 300, tau_fs: 100}
  formula: sigma = sigma_intra + sigma_inter; sigma_intra = 2 i e^2 k_B T /(pi hbar^2 (omega + i/tau)) ln[2 cosh(mu/2k_BT)]; sigma_inter = e^2/(4 hbar) [theta(hbar
    omega - 2mu) - (i/2pi) ln((hbar omega+2mu)^2/((hbar omega-2mu)^2 + (2k_BT)^2))]
notes: [Needs a 2D-conductivity boundary condition in the engine (not a bulk eps). Defaults are illustrative; mu and tau are sample parameters., 'Common bulk surrogate:
    eps = 1 + i sigma/(eps0 omega t) with t = 0.335 nm.']
references:
- {key: Falkovsky2008, citation: 'L. A. Falkovsky, Optical properties of graphene, J. Phys.: Conf. Ser. 129, 012004 (2008)', url: 'https://arxiv.org/abs/0806.3663'}
